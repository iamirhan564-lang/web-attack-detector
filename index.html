<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Attack Detector — Отчёт</title>
    <!-- Подключаем библиотеку для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #e0e0e0; padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        h1 { color: #ff5252; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .info { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        
        /* Карточки статистики */
        .stats-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; background: #2d2d2d; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #ff5252; }
        .card h3 { margin: 0; font-size: 14px; color: #aaa; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #fff; }

        /* Графики */
        .charts-row { display: flex; gap: 20px; margin-top: 30px; }
        .chart-box { flex: 1; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        .chart-box h3 { text-align: center; color: #fff; margin-bottom: 15px; font-size: 16px; }

        /* Таблица */
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #111; color: #ff5252; }
        .danger { color: #ff5252; font-weight: bold; }

        /* 📱 УПРОЩЕНИЕ ДЛЯ ТЕЛЕФОНОВ (Медиа-запрос) */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 20px; }
            .stats-cards { flex-direction: column; gap: 10px; }
            .card { padding: 10px; border-left: none; border-top: 5px solid #ff5252; }
            .card p { font-size: 22px; }
            .charts-row { flex-direction: column; } /* Графики встают друг под другом */
            .chart-box { display: none; } /* Можно скрыть графики на телефоне, чтобы не листать долго. Если хочешь оставить — удали эту строчку! */
            th, td { padding: 8px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Кибербезопасность: Отчет об инцидентах</h1>
        <div class="info" id="date-info">Дата генерации: загрузка...</div>
        
        <div class="stats-cards">
            <div class="card"><h3>Всего атакующих IP</h3><p id="stat-ips">0</p></div>
            <div class="card"><h3>Всего атак</h3><p id="stat-total">0</p></div>
            <div class="card"><h3>Критичных угроз (High)</h3><p id="stat-high">0</p></div>
        </div>

        <div class="charts-row">
            <div class="chart-box">
                <h3>Топ атакующих IP</h3>
                <canvas id="ipChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Типы атак</h3>
                <canvas id="typeChart"></canvas>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>IP-адрес нарушителя</th>
                    <th>Количество атак</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Данные добавятся автоматически -->
            </tbody>
        </table>
    </div>

    <script>
        // Загружаем данные из report.json
        fetch('report.json')
            .then(response => response.json())
            .then(data => renderData(data))
            .catch(error => {
                document.getElementById('date-info').innerText = "Ошибка: report.json не найден.";
            });

        function renderData(report) {
            // Заполняем текстовые данные
            document.getElementById('date-info').innerText = "Дата генерации: " + (report.date || "неизвестно");
            
            const attackStats = report.attack_stats || {};
            const severityStats = report.severity_stats || {};
            
            const ips = Object.keys(attackStats);
            const counts = Object.values(attackStats);
            
            document.getElementById('stat-ips').innerText = ips.length;
            document.getElementById('stat-total').innerText = report.total_attacks || 0;
            document.getElementById('stat-high').innerText = severityStats.High || 0;

            // Заполняем таблицу
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            // Сортируем IP по количеству атак (от большего)
            let sorted = ips.map((ip, i) => ({ip: ip, count: counts[i]})).sort((a,b) => b.count - a.count);
            
            sorted.forEach(item => {
                tbody.innerHTML += `<tr><td>${item.ip}</td><td class="danger">${item.count}</td></tr>`;
            });

            // Рисуем графики (Chart.js)
            new Chart(document.getElementById('ipChart'), {
                type: 'bar',
                data: {
                    labels: ips,
                    datasets: [{ label: 'Атак', data: counts, backgroundColor: '#ff5252' }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#aaa' } }, x: { ticks: { color: '#aaa' } } } }
            });

            // Код для круговой диаграммы (Типы атак)
if (report.type_stats) {
    const typeLabels = Object.keys(report.type_stats);
    const typeCounts = Object.values(report.type_stats);
    const colors = ['#ff5252', '#ffb74d', '#4fc3f7', '#81c784', '#ba68c8'];

    new Chart(document.getElementById('typeChart'), {
        type: 'doughnut',
        data: {
            labels: typeLabels,
            datasets: [{
                data: typeCounts,
                backgroundColor: colors
            }]
        },
        options: {
            plugins: {
                legend: { labels: { color: '#aaa' } }
            }
        }
    });
}
        }
    </script>
</body>
</html>

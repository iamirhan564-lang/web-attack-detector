<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Attack Detector — Отчёт</title>
    <!-- Подключаем библиотеку для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #e0e0e0; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        h1 { color: #ff5252; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .info { color: #aaa; margin-bottom: 20px; font-size: 14px; }

        <h1>🛡️ Кибербезопасность: Отчет об инцидентах</h1>

        <!-- НОВЫЙ БЛОК С QR-КОДОМ -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://iamirhan564-lang.github.io/web-attack-detector/" alt="QR Code" style="border-radius: 10px; border: 2px solid #ff5252;">
            <p style="color: #888; font-size: 12px; margin-top: 5px;">Отсканируйте для доступа с телефона</p>
        </div>

        /* Карточки статистики */
        .stats-cards { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 200px; background: #2d2d2d; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #ff5252; }
        .card h3 { margin: 0; font-size: 14px; color: #aaa; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #fff; }

        /* Графики */
        .charts-row { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .chart-box { flex: 1; min-width: 300px; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        .chart-box h3 { text-align: center; color: #fff; margin-bottom: 15px; font-size: 16px; }

        /* Таблица */
        .table-wrap { overflow-x: auto; margin-top: 30px; background: #1e1e1e; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #111; color: #ff5252; position: sticky; top: 0; }
        tr:hover { background-color: #2a2a2a; }
        
        /* Цвета для уровней риска */
        .risk-high { color: #ff5252; font-weight: bold; }
        .risk-medium { color: #ffb74d; font-weight: bold; }
        .risk-low { color: #4fc3f7; font-weight: bold; }

        /* 📱 УПРОЩЕНИЕ ДЛЯ ТЕЛЕФОНОВ */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 20px; }
            .stats-cards { flex-direction: column; gap: 10px; }
            .card { border-left: none; border-top: 5px solid #ff5252; }
            .charts-row { flex-direction: column; }
            th, td { padding: 8px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Кибербезопасность: Отчет об инцидентах</h1>
        <div class="info" id="date-info">Дата генерации: загрузка...</div>

        <div class="stats-cards">
            <div class="card"><h3>Всего атакующих IP</h3><p id="stat-ips">0</p></div>
            <div class="card"><h3>Всего атак</h3><p id="stat-total">0</p></div>
            <div class="card"><h3>Критичных угроз (High)</h3><p id="stat-high">0</p></div>
        </div>

        <div class="charts-row">
            <div class="chart-box">
                <h3>Топ атакующих IP</h3>
                <canvas id="ipChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Типы атак</h3>
                <canvas id="typeChart"></canvas>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>IP-адрес нарушителя</th>
                        <th>Тип атаки</th>
                        <th>Уровень риска</th>
                        <th>Сырой лог</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Данные добавятся автоматически -->
                </tbody>
                </table>
        </div>
    </div>

    <script>
        // Загружаем данные из report.json
        fetch('report.json')
            .then(response => response.json())
            .then(data => renderData(data))
            .catch(error => {
                document.getElementById('date-info').innerText = "Ошибка: report.json не найден или поврежден.";
                console.error(error);
            });

        function renderData(report) {
            // Заполняем текстовые данные
            document.getElementById('date-info').innerText = "Дата генерации: " + (report.date || "неизвестно");
            
            const attackStats = report.attack_stats || {};
            const severityStats = report.severity_stats || {};
            const typeStats = report.type_stats || {};
            const details = report.details || [];
            
            document.getElementById('stat-ips').innerText = Object.keys(attackStats).length;
            document.getElementById('stat-total').innerText = report.total_attacks || 0;
            document.getElementById('stat-high').innerText = severityStats.High || 0;

            // Заполняем таблицу детальными данными
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            if (details.length > 0) {
                details.forEach(item => {
                    let riskClass = 'risk-low';
                    if (item.severity === 'High') riskClass = 'risk-high';
                    if (item.severity === 'Medium') riskClass = 'risk-medium';

                    // Обрезаем сырой лог, если он слишком длинный
                    let shortLog = item.raw_log;
                    if (shortLog.length > 70) shortLog = shortLog.substring(0, 70) + '...';

                    tbody.innerHTML += `<tr>
                        <td><strong>${item.ip}</strong></td>
                        <td>${item.attack}</td>
                        <td class="${riskClass}">${item.severity}</td>
                        <td style="font-family: monospace; font-size: 12px; color: #888;">${shortLog}</td>
                    </tr>`;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Атак не обнаружено.</td></tr>';
            }

            // --- РИСУЕМ ГРАФИКИ (Chart.js) ---
            
            // 1. Столбчатая диаграмма (по IP)
            const ipLabels = Object.keys(attackStats);
            const ipData = Object.values(attackStats);
            
            new Chart(document.getElementById('ipChart'), {
                type: 'bar',
                data: {
                    labels: ipLabels,
                    datasets: [{ label: 'Атак', data: ipData, backgroundColor: '#ff5252' }]
                },
                options: { 
                    plugins: { legend: { display: false } }, 
                    scales: { y: { beginAtZero: true, ticks: { color: '#aaa' } }, x: { ticks: { color: '#aaa' } } } 
                }
            });

            // 2. Кольцевая диаграмма (по типам атак)
            const typeLabels = Object.keys(typeStats);
            const typeData = Object.values(typeStats);
            const colors = ['#ff5252', '#ffb74d', '#4fc3f7', '#81c784', '#ba68c8'];

            new Chart(document.getElementById('typeChart'), {
                type: 'doughnut',
                data: {
                    labels: typeLabels,
                    datasets: [{ data: typeData, backgroundColor: colors }]
                },
                options: {
                    plugins: { legend: { labels: { color: '#aaa' } } }
                }
            });
        }
    </script>
</body>
</html>

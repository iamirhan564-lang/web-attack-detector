<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Attack Detector — Отчёт</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12121c;
            color: #e2e2f0;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2a2a3c;
        }
        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
        }
        header h1 span {
            color: #ff4d6d;
        }
        header p {
            color: #8a8aab;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background-color: #1e1e2d;
            border: 1px solid #2a2a3c;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff4d6d;
            line-height: 1.2;
        }
        .stat-card .label {
            color: #8a8aab;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ffffff;
            border-left: 4px solid #ff4d6d;
            padding-left: 10px;
        }
        .table-wrap {
            background-color: #1e1e2d;
            border-radius: 12px;
            border: 1px solid #2a2a3c;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #2a2a3c;
        }
        th {
            background-color: #181824;
            color: #8a8aab;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #252538;
        }
        .empty {
            background-color: #1e1e2d;
            border: 1px dashed #2a2a3c;
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            color: #8a8aab;
            font-size: 1.1rem;
        }
        .loader {
            width: 40px;
            height: 40px;
            margin: 1rem auto 0;
            border: 3px solid rgba(255, 77, 109, 0.2);
            border-top-color: #ff4d6d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer {
            text-align: center;
            color: #555577;
            font-size: 0.8rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web <span>Attack</span> Detector</h1>
            <p>Результаты анализа логов веб-сервера</p>
        </header>

        <div id="app">
            <div class="loader">Загрузка отчёта...</div>
        </div>

        <footer>Отчёт сгенерирован из report.json</footer>
    </div>

    <script>
        const app = document.getElementById('app');
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        fetch('report.json')
            .then(response => response.json())
            .then(data => render(data))
            .catch(error => {
                app.innerHTML = '<div class="empty">Ошибка загрузки данных. Убедитесь, что report.json существует.</div>';
                console.error(error);
            });

        function render(report) {
            let total = 0;
            let ipCount = 0;
            let attacks = [];

            if (report.attack_stats) {
                total = report.total_attacks || 0;
                const ips = Object.keys(report.attack_stats);
                ipCount = ips.length;

                for (const ip of ips) {
                    attacks.push({
                        ip: ip,
                        count: report.attack_stats[ip]
                    });
                }
            } 

            let html = '';

            html += '<div class="stats">';
            html += `<div class="stat-card"><div class="value">${total}</div><div class="label">Всего инцидентов</div></div>`;
            html += `<div class="stat-card"><div class="value">${ipCount}</div><div class="label">Уникальных IP</div></div>`;
            
            if (report.severity_stats && report.severity_stats.High !== undefined) {
                html += `<div class="stat-card"><div class="value" style="color: #ff4d6d;">${report.severity_stats.High}</div><div class="label">Критических атак</div></div>`;
            }
            html += '</div>';

            if (total === 0 || attacks.length === 0) {
                html += '<div class="empty">Атак не обнаружено (или файл пуст).</div>';
            } else {
                html += '<h2 class="section-title">Статистика по IP-адресам</h2>';
                html += '<div class="table-wrap"><table><thead><tr>';
                html += '<th>#</th><th>IP-адрес нарушителя</th><th>Количество атак</th><th>Уровень риска</th>';
                html += '</tr></thead><tbody>';

                attacks.sort((a, b) => (b.count || 0) - (a.count || 0));

                attacks.forEach((a, i) => {
                    let riskLabel = "Низкий";
                    let riskColor = "#4fc3f7";
                    
                    if (a.count > 10) {
                        riskLabel = "Высокий";
                        riskColor = "#ff4d6d";
                    } else if (a.count > 5) {
                        riskLabel = "Средний";
                        riskColor = "#ffb74d";
                    }

                    html += '<tr>';
                    html += `<td>${i + 1}</td>`;
                    html += `<td><strong>${escapeHtml(a.ip)}</strong></td>`;
                    html += `<td>${a.count || 0}</td>`;
                    html += `<td><span style="color: ${riskColor}; font-weight: bold;">${riskLabel}</span></td>`;
                    html += '</tr>';
                });

                html += '</tbody></table></div>';
            }

            app.innerHTML = html;
        }
    </script>
</body>
</html>

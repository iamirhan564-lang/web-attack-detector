
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Дашборд ИБ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        h1 { color: #ff5252; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .stats-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; background: #2d2d2d; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #ff5252; }
        .card h3 { margin: 0; font-size: 14px; color: #aaa; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #fff; }
        .charts-row { display: flex; gap: 20px; margin-top: 30px; }
        .chart-box { flex: 1; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #111; color: #ff5252; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Кибербезопасность: Отчет об инцидентах</h1>
        <p>Дата генерации: 24.11.2026 16:17</p>
        
        <div class="stats-cards">
            <div class="card"><h3>Всего атакующих IP</h3><p>5</p></div>
            <div class="card"><h3>Всего атак</h3><p>44</p></div>
            <div class="card"><h3>Критичных угроз (High)</h3><p>27</p></div>
        </div>

        <div class="charts-row">
            <div class="chart-box">
                <h3 style="text-align:center;">Топ атакующих IP</h3>
                <canvas id="ipChart"></canvas>
            </div>
            <div class="chart-box">
                <h3 style="text-align:center;">Типы атак</h3>
                <canvas id="typeChart"></canvas>
            </div>
        </div>

        <table>
            <tr>
                <th>IP-адрес нарушителя</th>
                <th>Количество атак</th>
            </tr>
<tr><td>10.0.0.99</td><td style='color:#ff5252; font-weight:bold;'>5</td></tr><tr><td>8.8.8.8</td><td style='color:#ff5252; font-weight:bold;'>14</td></tr><tr><td>10.0.0.5</td><td style='color:#ff5252; font-weight:bold;'>7</td></tr><tr><td>192.168.1.12</td><td style='color:#ff5252; font-weight:bold;'>10</td></tr><tr><td>192.168.1.10</td><td style='color:#ff5252; font-weight:bold;'>8</td></tr>
        </table>
    </div>
    <script>
        new Chart(document.getElementById('ipChart'), {
            type: 'bar',
            data: { labels: ["10.0.0.99", "8.8.8.8", "10.0.0.5", "192.168.1.12", "192.168.1.10"], datasets: [{ label: 'Атак', data: [5, 14, 7, 10, 8], backgroundColor: '#ff5252' }] },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        new Chart(document.getElementById('typeChart'), {
            type: 'doughnut',
            data: { labels: ["SQL-\u0438\u043d\u044a\u0435\u043a\u0446\u0438\u044f", "Path Traversal", "\u0421\u043a\u0430\u043d\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0443\u044f\u0437\u0432\u0438\u043c\u043e\u0441\u0442\u0435\u0439", "XSS-\u0430\u0442\u0430\u043a\u0430 (\u0441\u043a\u0440\u0438\u043f\u0442)"], datasets: [{ data: [19, 9, 8, 8], backgroundColor: ['#ff5252', '#ffb74d', '#4fc3f7', '#81c784', '#ba68c8'] }] }
        });
    </script>
</body>
</html>
